name: Auto-close Feature Requests
on:
  issues:
    types: [opened]

jobs:
  close-feature-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue looks like a feature request
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();

            const isFeatureRequest =
              title.includes("feature request") ||
              body.includes("feature request");

            if (isFeatureRequest) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `
                  This looks like a **feature request**.  
                  Please use the following Discussion instead:  
                  👉 https://github.com/spatie/ray-app-v3-beta/discussions/1

                  Closing this issue.`
              });

              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                state: "closed"
              });
            }
